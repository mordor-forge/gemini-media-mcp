# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release pipeline (see .github/workflows/release.yml):
#   goreleaser release --clean   -> binaries, archives, Gemini CLI extension archives,
#                                   checksums and the GitHub release
#   scripts/build-npm-packages.sh -> npm wrapper + per-platform packages from dist/
#   scripts/build-mcpb.sh         -> Claude Desktop bundle (.mcpb) from dist/
#
# Local dry run: goreleaser release --snapshot --clean  (or: goreleaser build --snapshot --clean --single-target)
version: 2

project_name: gemini-media-mcp

before:
  hooks:
    # The Gemini CLI archives below ship the binary, so their manifest runs it
    # directly instead of the npx launcher used by git-clone installs.
    - sh scripts/gemini-release-manifest.sh

builds:
  - id: gemini-media-mcp
    main: ./cmd/gemini-media-mcp
    binary: gemini-media-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mordor-forge/gemini-media-mcp/internal/version.Version={{ .Version }}
      - -X github.com/mordor-forge/gemini-media-mcp/internal/version.Commit={{ .FullCommit }}
      - -X github.com/mordor-forge/gemini-media-mcp/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One macOS binary for both CPUs, used by the MCP Bundle (MCPB manifests cannot
# select a binary per CPU architecture). replace: false keeps the per-arch darwin
# binaries for the archives and the npm platform packages.
universal_binaries:
  - id: darwin-universal
    ids: [gemini-media-mcp]
    name_template: gemini-media-mcp
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Standalone downloads: the binary plus the plugin manifests and skills, so an
  # extracted archive is also a complete plugin directory.
  - id: default
    ids: [gemini-media-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - skills/**/*
      - plugin.json
      - mcp.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .codex-plugin/plugin.json
      - gemini-extension.json
      - packaging/gemini/GEMINI-EXTENSION.md

  # Gemini CLI extension archives, picked by `gemini extensions install <repo-url>`
  # from the latest GitHub release: {platform}.{arch}.{name}.{tar.gz|zip} with
  # platform darwin|linux|win32, arch x64|arm64 and name = the "name" field of
  # gemini-extension.json. gemini-extension.json must sit at the archive root.
  - id: gemini-extension
    ids: [gemini-media-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- if eq .Os "windows" }}win32{{ else }}{{ .Os }}{{ end }}.
      {{- if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}.gemini-media-mcp
    files:
      # Generated by scripts/gemini-release-manifest.sh (before hook).
      - src: .build/gemini-extension/gemini-extension.json
        strip_parent: true
      - LICENSE
      - skills/**/*
      - packaging/gemini/GEMINI-EXTENSION.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

report_sizes: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Models and pricing
      regexp: '^.*?(catalog|models?)(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge (pull request|branch)"

release:
  # Pre-release tags (v1.2.0-rc.1) are not marked "Latest", so Gemini CLI and
  # MCPB links keep pointing at the last stable release.
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    **Install:** Claude Code `claude plugin marketplace add mordor-forge/gemini-media-mcp && claude plugin install gemini-media@mordor-forge` ·
    Gemini CLI `gemini extensions install https://github.com/mordor-forge/gemini-media-mcp` ·
    any MCP client `npx -y gemini-media-mcp@{{ .Version }}` ·
    Claude Desktop: download `gemini-media-mcp-{{ .Version }}.mcpb` below.
    More clients: [packaging/INSTALL-SNIPPETS.md](https://github.com/mordor-forge/gemini-media-mcp/blob/v{{ .Version }}/packaging/INSTALL-SNIPPETS.md).

