  - id: gemini-2.5-pro-preview-tts
    vertexId: gemini-2.5-pro-tts
    aliases: [tts-pro]
    title: Gemini 2.5 Pro TTS
    family: gemini-tts
    mediaType: speech
    status: preview
    released: "2025-05-20"
    replacement: gemini-3.8-flash-tts
