# gemini-media-mcp model catalog.
#
# Single source of truth for model IDs, aliases, lifecycle, capabilities,
# constraints and list prices. Override or extend it without rebuilding by
# pointing GEMINI_MEDIA_CATALOG (or `catalogFile:` in config.yaml) at a YAML
# file with the same shape; entries are merged by `id` and hot-reloaded.
#
# Prices are USD list prices (paid tier, standard/on-demand) and are used for
# estimates only. Authoritative spend lives in AI Studio / Cloud Billing.
version: "2026-10-07"
sources:
  - https://ai.google.dev/gemini-api/docs/models
  - https://ai.google.dev/gemini-api/docs/models/gemini-nano-banana-2.1
  - https://ai.google.dev/gemini-api/docs/deprecations
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/veo
  - https://ai.google.dev/gemini-api/docs/omni
  - https://ai.google.dev/gemini-api/docs/generate-content/image-generation
  - https://ai.google.dev/gemini-api/docs/generate-content/speech-generation
  - https://ai.google.dev/gemini-api/docs/generate-content/music-generation
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/google-models
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/nano-banana-2-1
  - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing

defaults:
  image: gemini-nano-banana-2.1
  video: veo-3.1-lite-generate-preview
  speech: gemini-3.8-flash-tts
  music: lyria-3-clip-preview

models:
  # ---------------------------------------------------------------- images
  - id: gemini-nano-banana-2.1
    aliases: [nb2, nb2.1, nano-banana-2.1, flash-image]
    title: Nano Banana 2.1
    family: gemini-image
    mediaType: image
    status: ga
    released: "2026-10-06"
    summary: Best default. Update to Nano Banana 2 with better visual quality, prompt adherence, text rendering and multi-turn consistency, at half its per-image price at 1K and 2K (three quarters at 4K). 1K to 4K, extreme aspect ratios, up to 14 reference images.
    backends: [gemini-api, vertex]
    vertexLocations: [global]
    capabilities:
      aspectRatios: ["1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4", "8:1", "9:16", "16:9", "21:9"]
      imageSizes: ["1K", "2K", "4K"]
      maxReferenceImages: 14
      edit: true
      searchGrounding: true
      geminiApiOnly: [googleSearch]
    pricing:
      asOf: "2026-10-06"
      source: https://ai.google.dev/gemini-api/docs/pricing
      inputPer1M: {text: 1.50, image: 1.50}
      outputPer1M: {text: 7.50, image: 30.00}
      imageOutputTokens: {"1K": 1120, "2K": 1680, "4K": 3780}
      inputImageTokens: 1120
      textOutputTokens: 900
      vertexRegionalMultiplier: 1.1
      batchDiscount: 0.5
    notes:
      - No 512px output (minimum 1K). Thinking level defaults to medium; thinking tokens bill at the text output rate (700-2200 per image in live calls, typically about 900, so about $0.007 per image).
      - Grounding with Google Web and Image Search on the Gemini API. Vertex AI search grounding and regional availability are unconfirmed, so googleSearch is dropped there as for Nano Banana 2.
      - Token rates from launch-day listings. Image tokens per size were measured from live billing on 2026-10-06 (1K 1120, 2K 1680, 4K 3780; listings said 2520 for 4K). Reconciled costs use the usage the API reports.

  - id: gemini-3.1-flash-image
    aliases: [nano-banana-2]
    title: Nano Banana 2
    family: gemini-image
    mediaType: image
    status: deprecated
    released: "2026-05-28"
    shutdown: "2026-10-29"
    replacement: gemini-nano-banana-2.1
    summary: Previous default, replaced by Nano Banana 2.1 (better and cheaper). Shuts down on the Gemini API on 2026-10-29. The only model with 512px drafts.
    backends: [gemini-api, vertex]
    vertexLocations: [global]
    capabilities:
      aspectRatios: ["1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4", "8:1", "9:16", "16:9", "21:9"]
      imageSizes: ["512", "1K", "2K", "4K"]
      maxReferenceImages: 14
      edit: true
      searchGrounding: true
      geminiApiOnly: [googleSearch]
    pricing:
      asOf: "2026-09-24"
      source: https://ai.google.dev/gemini-api/docs/pricing
      inputPer1M: {text: 0.50, image: 0.50}
      outputPer1M: {text: 3.00, image: 60.00}
      imageOutputTokens: {"512": 747, "1K": 1120, "2K": 1680, "4K": 2520}
      inputImageTokens: 1120
      vertexRegionalMultiplier: 1.1
      batchDiscount: 0.5
    notes:
      - Reference images - up to 10 objects and 4 characters.
      - Google Search grounding is not offered for this model on Vertex AI.

  - id: gemini-3-pro-image
    aliases: [pro, nano-banana-pro, pro-image]
    title: Nano Banana Pro
    family: gemini-image
    mediaType: image
    status: ga
    released: "2026-05-28"
    summary: Highest fidelity for dense infographics, complex multi-subject scenes and final renders. Slower and about 3-4x the price of Nano Banana 2.1 at 1K; try nb2 first.
    backends: [gemini-api, vertex]
    vertexLocations: [global]
    capabilities:
      aspectRatios: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
      imageSizes: ["1K", "2K", "4K"]
      maxReferenceImages: 14
      edit: true
      searchGrounding: true
    pricing:
      asOf: "2026-09-24"
      source: https://ai.google.dev/gemini-api/docs/pricing
      inputPer1M: {text: 2.00, image: 2.00}
      outputPer1M: {text: 12.00, image: 120.00}
      imageOutputTokens: {"1K": 1120, "2K": 1120, "4K": 2000}
      inputImageTokens: 560
      textOutputTokens: 900
      batchDiscount: 0.5
    notes:
      - Reference images - up to 6 objects, 5 characters and 3 style references.

  - id: gemini-3.1-flash-lite-image
    aliases: [nb2-lite, nano-banana-2-lite, lite-image]
    title: Nano Banana 2 Lite
    family: gemini-image
    mediaType: image
    status: ga
    released: "2026-06-30"
    summary: Cheapest image model for bulk drafts and thumbnails. Same per-image price as Nano Banana 2.1 but cheaper input and text tokens; 1K only, no search grounding, weaker at multi-reference edits.
    backends: [gemini-api, vertex]
    vertexLocations: [global]
    capabilities:
      imageSizes: ["1K"]
      maxReferenceImages: 14
      edit: true
    pricing:
      asOf: "2026-09-24"
      source: https://ai.google.dev/gemini-api/docs/pricing
      inputPer1M: {text: 0.25, image: 0.25}
      outputPer1M: {text: 1.50, image: 30.00}
      imageOutputTokens: {"1K": 1120}
      inputImageTokens: 1120
      batchDiscount: 0.5

  - id: gemini-2.5-flash-image
    aliases: [nano-banana, nb1]
    title: Nano Banana (legacy)
    family: gemini-image
    mediaType: image
    status: deprecated
    released: "2025-10-02"
    shutdown: "2026-10-02"
    replacement: gemini-nano-banana-2.1
    summary: Legacy first-generation model. Shuts down on the Gemini API on 2026-10-02 (Vertex AI on 2027-03-15).
    backends: [gemini-api, vertex]
    vertexLocations: [global, us-central1]
    capabilities:
      aspectRatios: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
      maxReferenceImages: 3
      edit: true
    pricing:
      asOf: "2026-09-24"
      inputPer1M: {text: 0.30, image: 0.30}
      outputPer1M: {text: 2.50, image: 30.00}
      imageOutputTokens: {"1K": 1290}

  - id: gemini-3.1-flash-image-preview
    family: gemini-image
    mediaType: image
    status: retired
    shutdown: "2026-06-25"
    replacement: gemini-nano-banana-2.1
